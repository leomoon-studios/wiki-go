name: Test

on:
  pull_request:
  push:
    branches:
      - master
      - codex/windows-path-step6-*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GOFLAGS: -mod=vendor

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Capture platform context
        shell: bash
        run: |
          go version
          go env GOOS GOARCH

      - name: Run Go tests
        shell: bash
        run: |
          set -o pipefail
          go test ./... -count=1 -v 2>&1 | tee go-tests.log

      - name: Test login redirects
        shell: bash
        run: |
          set -o pipefail
          node --test tests/login_redirect_test.js 2>&1 | tee login-redirects.log

      - name: Test search UI
        shell: bash
        run: |
          set -o pipefail
          node --test tests/search_ui_test.js 2>&1 | tee search-ui.log

      - name: Test safe DOM rendering
        shell: bash
        run: |
          set -o pipefail
          node --test tests/xss_dom_test.js 2>&1 | tee safe-dom.log

      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.os }}
          path: |
            go-tests.log
            login-redirects.log
            search-ui.log
            safe-dom.log
