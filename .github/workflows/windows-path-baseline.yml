name: Windows path authorization baseline

on:
  push:
    branches:
      - codex/windows-path-step1-*
      - codex/windows-path-step2-*
      - codex/windows-path-step3-*
      - codex/windows-path-step4-*
      - codex/windows-path-step5-*

permissions:
  contents: read

jobs:
  baseline:
    if: startsWith(github.ref, 'refs/heads/codex/windows-path-step1-')
    name: Baseline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Capture platform and filesystem context
        shell: bash
        run: |
          go version
          go env GOOS GOARCH
      - name: Run passing controls
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/auth ./internal/handlers -count=1 -v -run '^(TestFinanceAccessControls|TestFinanceDisclosureControls|TestFinanceDistinctCaseSensitivePaths)$' 2>&1 | tee controls.log
      - name: Capture unfixed authorization regressions
        if: always()
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/auth ./internal/handlers -count=1 -v -run '^(TestWindowsFinance.*|TestFinanceNestedAttachmentDenied)$' 2>&1 | tee regressions.log
      - name: Preserve baseline evidence, including expected Windows failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-path-baseline-${{ matrix.os }}
          path: |
            controls.log
            regressions.log

  resolver:
    if: startsWith(github.ref, 'refs/heads/codex/windows-path-step2-')
    name: Path identity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Capture platform context
        shell: bash
        run: |
          go version
          go env GOOS GOARCH
      - name: Validate path identities and existing path controls
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/utils -count=1 -v -run '^(TestWindowsDocumentIdentity.*|TestDocumentIdentity.*|TestCanonicalRequestPath|TestResolve.*DocumentPath.*)$' 2>&1 | tee resolver.log
      - name: Preserve path identity validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-path-step2-${{ matrix.os }}
          path: resolver.log

  pages:
    if: startsWith(github.ref, 'refs/heads/codex/windows-path-step3-')
    name: Page authorization (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Capture platform context
        shell: bash
        run: |
          go version
          go env GOOS GOARCH
      - name: Validate page authorization and route controls
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/auth ./internal/handlers ./internal/routes -count=1 -v -run '^(TestDocumentAccess.*|TestFinance.*|TestWindowsFinance.*|TestPageIdentity.*|TestWindowsPageIdentity.*|TestCheckAccess.*|TestPageRoute.*|TestBasePath.*|TestRootSearchRoute|TestRestrictedDocumentAccess.*|TestPageHandlerDoesNotDisclose.*|TestStatsRespectDocumentAccessAcrossRenderPaths)$' 2>&1 | tee pages.log
      - name: Preserve page authorization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-path-step3-${{ matrix.os }}
          path: pages.log

  attachments:
    if: startsWith(github.ref, 'refs/heads/codex/windows-path-step4-')
    name: Attachment authorization (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Capture platform context
        shell: bash
        run: |
          go version
          go env GOOS GOARCH
      - name: Validate attachment identities and operation controls
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/auth ./internal/handlers ./internal/routes -count=1 -v -run '^(TestAttachmentIdentity.*|TestWindowsAttachmentIdentity.*|TestResolveAttachment.*|TestValidateAttachmentFilename|TestRenameFileHandler.*|TestUploadAndDeleteUseAttachmentStorageBoundary|TestSanitizeSVG.*|TestSVGUpload.*|TestServeSVG.*|TestFinance.*|TestWindowsFinance.*|TestDocumentAccess.*|TestRestrictedDocument.*|TestPageIdentity.*|TestWindowsPageIdentity.*|TestBasePath.*)$' 2>&1 | tee attachments.log
      - name: Preserve attachment authorization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-path-step4-${{ matrix.os }}
          path: attachments.log

  document-apis:
    if: startsWith(github.ref, 'refs/heads/codex/windows-path-step5-')
    name: Document APIs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Capture platform context
        shell: bash
        run: |
          go version
          go env GOOS GOARCH
      - name: Validate document APIs and prior security controls
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/auth ./internal/comments ./internal/utils ./internal/handlers ./internal/routes -count=1 -v 2>&1 | tee document-apis.log
      - name: Preserve document API validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-path-step5-${{ matrix.os }}
          path: document-apis.log
