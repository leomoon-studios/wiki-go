{{define "notfound"}}
<h1>{{t "notfound.title"}}</h1>
<p>{{t "notfound.message"}}</p>

{{if and .IsAuthenticated (or (eq .UserRole "admin") (eq .UserRole "editor"))}}
<div class="create-missing-page">
    <p>{{t "notfound.create_prompt"}}</p>
    <button class="dialog-button primary" id="create-missing-page" data-current-path="{{.CurrentDir.Path}}">
        <!-- <i class="fa fa-plus"></i> -->
        <span class="button-text">{{t "notfound.create_button"}}</span>
    </button>
</div>

<script src="/static/js/404.js?={{getVersion}}" defer></script>
{{end}}
{{end}}
